version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: nomadly-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    # Ensure the volume is used before removing or recreating the container

  app:
    image: tayaa1/nomadly-backend:latest
    container_name: nomadly-backend
    restart: always
    depends_on:
      - mongo
    ports:
      - "3005:3000"
    environment:
      - MONGODB_URI=mongodb://root:example@mongo:27017/nomadly?authSource=admin
      - NODE_ENV=production
      # Email configuration
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_SECURE=false
      - MAIL_USER=nomadly.app2025@gmail.com
      - MAIL_PASSWORD=jqkh skhy ldqy nkuo
      - MAIL_FROM="Nomadly App" <nomadly.app2025@gmail.com>

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app

volumes:
  mongo_data:
    driver: local
